version: '3.9'

# Entorno local mínimo para desarrollo del monorepo.
# PR 1: clinical-core y web ya no son placeholders; OpenMed usa imagen real.
# PR 2: worker robusto + web con URL de clinical-core como build arg.
services:
  postgres:
    image: postgres:16-alpine
    container_name: clinical-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinical_ops
      POSTGRES_USER: clinical_user
      POSTGRES_PASSWORD: clinical_pass
    ports:
      - "5432:5432"
    volumes:
      # Datos persistentes de PostgreSQL para no perder estado entre reinicios.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_user -d clinical_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinical-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  openmed:
    # Imagen real (antes: build ../openmed, ruta que no existe en este repo).
    # Tag verificado en local el 2026-11-10: 3.1.0 no existe en GHCR;
    # v3.2.0 sí, y con ese tag OpenMed levanta healthy.
    #   docker pull ghcr.io/maziyarpanahi/openmed:v3.2.0
    image: ghcr.io/maziyarpanahi/openmed:v3.2.0
    container_name: clinical-openmed
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      OPENMED_PORT: 8080

  minio:
    # S3 local para uploads (decisión PR 1); bucket real solo cuando toque.
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: clinical-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  clinical-core:
    build:
      context: ./apps/clinical-core
      dockerfile: Dockerfile
    container_name: clinical-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openmed:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://clinical_user:clinical_pass@postgres:5432/clinical_ops
      REDIS_URL: redis://redis:6379
      # URL interna (DNS de Docker Compose) para hablar con OpenMed.
      OPENMED_BASE_URL: http://openmed:8080
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-clinical-docs}
    ports:
      - "4000:4000"

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: clinical-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openmed:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://clinical_user:clinical_pass@postgres:5432/clinical_ops
      REDIS_URL: redis://redis:6379/0
      REDIS_QUEUE_NAME: document_jobs
      REDIS_DLQ_NAME: document_jobs_dlq
      OPENMED_BASE_URL: http://openmed:8080
      OPENMED_ANALYZE_PATH: /analyze-text
      OPENMED_VERSION: 3.2.0

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Se hornea en el build de Next.js (variable NEXT_PUBLIC_*); en local
        # el navegador alcanza clinical-core por localhost:4000.
        NEXT_PUBLIC_CLINICAL_CORE_URL: ${NEXT_PUBLIC_CLINICAL_CORE_URL:-http://localhost:4000}
    container_name: clinical-web
    restart: unless-stopped
    depends_on:
      clinical-core:
        condition: service_started
    environment:
      CLINICAL_CORE_BASE_URL: http://clinical-core:4000
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
